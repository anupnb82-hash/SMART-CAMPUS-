# =====================================================================
# SMART CAMPUS INTEGRATED MANAGEMENT SYSTEM
# Spring Boot 3.x Application Properties
# =====================================================================

spring.application.name=SmartCampus-ManagementSystem
server.port=8080

# ---------------------------------------------------------------------
# MySQL & JDBC Configuration (JdbcTemplate)
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_campus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ---------------------------------------------------------------------
# File Upload Settings (Assignments & Documents)
# ---------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
campus.upload.dir=./uploads/assignments

# ---------------------------------------------------------------------
# Campus Resource Rescue Engine Settings
# ---------------------------------------------------------------------
rescue.engine.grace-period-minutes=15
rescue.engine.slot-offer-expiry-minutes=30
rescue.engine.auto-allocation-enabled=true

# ---------------------------------------------------------------------
# Logging Configuration
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.smartcampus=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
